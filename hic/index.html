<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hic, Haec, Hoc Paradigm & Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Demonstrative: hic, haec, hoc</h1>
            <div class="controls">
                <button id="mode-chart-btn" class="active">Chart Mode</button>
                <button id="mode-quiz-btn">Quiz Mode</button>
            </div>
        </header>

        <div id="chart-mode" class="mode-view">
            <p class="instructions">Complete the paradigm. Tab navigates across the row.</p>
            
            <h2>Singular</h2>
            <table>
                <thead>
                    <tr>
                        <th>Case</th><th>Masculine</th><th>Feminine</th><th>Neuter</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Nom</td>
                        <td><input type="text" data-answers="hic"></td>
                        <td><input type="text" data-answers="haec"></td>
                        <td><input type="text" data-answers="hoc"></td>
                    </tr>
                    <tr>
                        <td>Gen</td>
                        <td><input type="text" data-answers="huius,hūius"></td>
                        <td><input type="text" data-answers="huius,hūius"></td>
                        <td><input type="text" data-answers="huius,hūius"></td>
                    </tr>
                    <tr>
                        <td>Dat</td>
                        <td><input type="text" data-answers="huic"></td>
                        <td><input type="text" data-answers="huic"></td>
                        <td><input type="text" data-answers="huic"></td>
                    </tr>
                    <tr>
                        <td>Acc</td>
                        <td><input type="text" data-answers="hunc"></td>
                        <td><input type="text" data-answers="hanc"></td>
                        <td><input type="text" data-answers="hoc"></td>
                    </tr>
                    <tr>
                        <td>Abl</td>
                        <td><input type="text" data-answers="hoc,hōc"></td>
                        <td><input type="text" data-answers="hac,hāc"></td>
                        <td><input type="text" data-answers="hoc,hōc"></td>
                    </tr>
                </tbody>
            </table>

            <h2>Plural</h2>
            <table>
                <thead>
                    <tr>
                        <th>Case</th><th>Masculine</th><th>Feminine</th><th>Neuter</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Nom</td>
                        <td><input type="text" data-answers="hi,hī"></td>
                        <td><input type="text" data-answers="hae"></td>
                        <td><input type="text" data-answers="haec"></td>
                    </tr>
                    <tr>
                        <td>Gen</td>
                        <td><input type="text" data-answers="horum,hōrum"></td>
                        <td><input type="text" data-answers="harum,hārum"></td>
                        <td><input type="text" data-answers="horum,hōrum"></td>
                    </tr>
                    <tr>
                        <td>Dat</td>
                        <td><input type="text" data-answers="his,hīs"></td>
                        <td><input type="text" data-answers="his,hīs"></td>
                        <td><input type="text" data-answers="his,hīs"></td>
                    </tr>
                    <tr>
                        <td>Acc</td>
                        <td><input type="text" data-answers="hos,hōs"></td>
                        <td><input type="text" data-answers="has,hās"></td>
                        <td><input type="text" data-answers="haec"></td>
                    </tr>
                    <tr>
                        <td>Abl</td>
                        <td><input type="text" data-answers="his,hīs"></td>
                        <td><input type="text" data-answers="his,hīs"></td>
                        <td><input type="text" data-answers="his,hīs"></td>
                    </tr>
                </tbody>
            </table>

            <div class="action-row">
                <button id="check-chart-btn">Check Chart</button>
                <button id="clear-chart-btn">Clear</button>
            </div>
        </div>
        
        <div id="quiz-mode" class="mode-view hidden">
            <div id="prompt-container">
                <p id="question-text">Loading...</p>
            </div>
            
            <div class="input-group">
                <input type="text" id="quiz-input" placeholder="Enter the Latin form" autocomplete="off">
                <button id="quiz-submit-btn">Check</button>
            </div>

            <div id="quiz-feedback"></div>
            <button id="quiz-next-btn" class="hidden">Next Form</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
