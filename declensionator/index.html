<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magister Declension | Latin Practice</title>
    <meta name="description" content="Practice Latin Noun Declensions" />
    
    <!-- Fonts: Added Libre Baskerville -->
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Quattrocento:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    
    <!-- Effects Overlays -->
    <div id="flash-overlay" class="flash-overlay"></div>
    <canvas id="confetti-canvas" class="confetti-canvas"></canvas>

    <!-- Header -->
    <header class="app-header">
      <div class="container mx-auto px-4">
        <h1 class="header-title font-serif">
          Declension-Ator
        </h1>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
      
      <!-- Vocab Selector -->
      <div class="selector-container">
        <label for="vocab-select" class="selector-label font-sans">Vocabulary:</label>
        <select id="vocab-select" class="vocab-selector">
          <option value="dickinson">Dickinson Core (Default)</option>
          <option value="ecceRomani">Ecce Romani</option>
        </select>
      </div>

      <!-- Stats -->
      <div class="score-board">
        <div class="score-item">
          <span class="score-label font-sans">Score</span>
          <span id="score-val" class="score-value font-serif">0 / 0</span>
        </div>
        <div class="score-item">
          <span class="score-label font-sans">Streak</span>
          <span class="score-value font-serif score-highlight"><span id="streak-val">0</span> 🔥</span>
        </div>
      </div>
      
      <!-- Game Card -->
      <div id="game-card" class="game-card">
        <div class="game-card-content">
          
          <!-- Noun Display -->
          <div class="noun-display">
            <span id="noun-nominative" class="noun-text">
              ...
            </span>
            <span id="noun-genitive" class="noun-text">
              ...
            </span>
            <span id="noun-gender" class="noun-gender">
              ...
            </span>
          </div>
          
          <!-- Definition -->
          <p id="noun-definition" class="noun-definition font-serif">
            ...
          </p>
  
          <!-- Buttons -->
          <div class="button-grid">
            <button id="btn-1" class="btn-base">
              1st
            </button>
            <button id="btn-2" class="btn-base">
              2nd
            </button>
            <button id="btn-3" class="btn-base">
              3rd
            </button>
          </div>
          
          <!-- Instructions -->
          <p class="instruction-text font-sans">
            Select the correct declension
          </p>
  
          <!-- Feedback / Next Area -->
          <div id="feedback-area" class="feedback-area">
            <div id="feedback-text" class="feedback-text">
              <!-- Result Text -->
            </div>
            <button id="next-btn" class="next-btn font-sans">
              Next Word
            </button>
          </div>
        </div>
      </div>
  
      <!-- Quote / Footer -->
      <div class="footer-quote">
        <p id="quote-latin" class="quote-latin">...</p>
        <p id="quote-english" class="quote-english">...</p>
        <p class="footer-credits">
          Data sourced from Dickinson College Commentaries Core Vocabulary.
        </p>
      </div>

    </main>

    <!-- App Logic -->
    <script src="nouns.js"></script>
    <script src="quotes.js"></script>
    <script src="app.js"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
