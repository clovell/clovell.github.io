<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Practice Latin noun, adjective, and noun-adjective agreement declensions across all five cases with streak tracking, sound effects, and instant feedback." />
  <title>Latin Declension Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="header-left">
        <span class="site-title">Grammatica Latina</span>
        <h1 class="page-title">Latin Declension Practice</h1>
      </div>
      <div class="header-right">
        <div class="accuracy-display">
          <span class="stat-label">Session Accuracy</span>
          <span class="stat-value" id="accuracy-value">100%</span>
        </div>
        <div class="streak-badge">
          <span class="streak-label">🔥 STREAK</span>
          <span class="streak-value" id="streak-value">0</span>
        </div>
      </div>
    </header>

    <nav class="mode-nav" aria-label="Practice Mode">
      <div class="mode-selector" id="mode-selector">
        <button class="mode-btn active" data-mode="noun" id="mode-noun">Nouns</button>
        <button class="mode-btn" data-mode="adjective" id="mode-adj">Adjectives</button>
        <button class="mode-btn" data-mode="pair" id="mode-pair">Noun + Adjective</button>
        <button class="mode-btn" data-mode="endings" id="mode-endings">Just the Endings</button>
      </div>
    </nav>

    <main id="main">
      <div class="word-section">
        <div class="endings-selectors hidden" id="endings-selectors">
          <div class="endings-selector-group">
            <span class="selector-label">Declension:</span>
            <div class="selector-buttons" id="endings-decl-buttons">
              <button class="decl-btn active" data-decl="1">1st</button>
              <button class="decl-btn" data-decl="2">2nd</button>
              <button class="decl-btn" data-decl="3">3rd</button>
            </div>
          </div>
          <div class="endings-selector-group">
            <span class="selector-label">Gender:</span>
            <div class="selector-buttons" id="endings-gender-buttons">
              <button class="decl-btn" data-gen="m">Masc.</button>
              <button class="decl-btn active" data-gen="f">Fem.</button>
              <button class="decl-btn" data-gen="n" disabled title="1st declension has no neuter nouns">Neut.</button>
            </div>
          </div>
        </div>

        <h2 class="word-display" id="word-display"></h2>

        <div class="declension-selector" id="declension-selector">
          <p class="selector-label" id="selector-label">Identify Declension:</p>
          <div class="selector-buttons" id="selector-buttons"></div>
        </div>

        <div class="tutorial" id="tutorial">
          <div class="tutorial-icon">💡</div>
          <div class="tutorial-body" id="tutorial-body">
            <strong class="tutorial-title" id="tutorial-title">Identifying the Declension</strong>
            <p class="tutorial-subtitle" id="tutorial-subtitle">Look at the genitive singular ending (the second part of the entry):</p>
            <ul class="tutorial-list" id="tutorial-list">
              <li><span class="ending-chip">-ae</span> 1st</li>
              <li><span class="ending-chip">-ī</span> 2nd</li>
              <li><span class="ending-chip">-is</span> 3rd</li>
            </ul>
          </div>
        </div>
      </div>

      <div class="input-grid" id="input-grid"></div>
    </main>

    <footer id="footer">
      <div class="toggles">
        <label class="toggle-label">
          <span class="toggle-track" id="macron-track">
            <span class="toggle-thumb"></span>
          </span>
          <input type="checkbox" class="sr-only" id="macron-toggle" checked />
          <span class="toggle-text">Macrons Optional</span>
        </label>
        <label class="toggle-label">
          <span class="toggle-track" id="dative-track">
            <span class="toggle-thumb"></span>
          </span>
          <input type="checkbox" class="sr-only" id="dative-toggle" />
          <span class="toggle-text">Include Dative</span>
        </label>
        <label class="toggle-label">
          <span class="toggle-track" id="neuter-track">
            <span class="toggle-thumb"></span>
          </span>
          <input type="checkbox" class="sr-only" id="neuter-toggle" />
          <span class="toggle-text">Include Neuter Nouns</span>
        </label>
        <label class="toggle-label">
          <span class="toggle-track" id="istem-track">
            <span class="toggle-thumb"></span>
          </span>
          <input type="checkbox" class="sr-only" id="istem-toggle" />
          <span class="toggle-text">Include i-stems</span>
        </label>
        <label class="toggle-label">
          <span class="toggle-track" id="sound-track">
            <span class="toggle-thumb"></span>
          </span>
          <input type="checkbox" class="sr-only" id="sound-toggle" checked />
          <span class="toggle-text">Sound <span id="sound-icon">🔊</span></span>
        </label>
      </div>
      <div class="actions">
        <span class="enter-hint" id="enter-hint">Press <kbd>Enter</kbd></span>
        <button id="skip-btn" class="btn btn-ghost">Skip</button>
        <button id="check-btn" class="btn btn-primary">Check Answers</button>
        <button id="next-btn" class="btn btn-primary btn-pulse" style="display:none">
          Next Word
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="declension.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
