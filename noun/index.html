<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latin Declension Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Latin Declension Practice</h1>
    <nav>
        <button id="btn-chart" class="active" onclick="switchMode('chart')">Chart Mode</button>
        <button id="btn-quiz" onclick="switchMode('quiz')">Quiz Mode</button>
    </nav>

    <div id="chart-mode" class="container active">
        <div class="header-controls">
            <h2 id="chart-lemma"></h2>
            <div class="options-group">
                <label class="toggle-label">
                    <input type="checkbox" id="vocative-toggle" onchange="loadNewChart()"> 
                    Include Vocative
                </label>
                <div id="score-display">Perfect Charts: <span id="score-count">0</span> | Streak: <span id="streak-count">0</span></div>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Case</th>
                    <th>Singular</th>
                    <th>Plural</th>
                </tr>
            </thead>
            <tbody id="chart-body">
                </tbody>
        </table>
        <div class="controls action-controls">
            <button id="btn-check" class="btn-check" onclick="checkChart()">Check Answers</button>
            <button id="btn-next" class="btn-next" style="display: none;" onclick="loadNewChart()">Next Noun &rarr;</button>
        </div>
    </div>

    <div id="quiz-mode" class="container">
        <div id="quiz-prompt"></div>
        <div class="quiz-input-group">
            <input type="text" id="quiz-input" placeholder="Type the form here..." onkeypress="if(event.key === 'Enter') checkQuiz()">
            <button onclick="checkQuiz()">Submit</button>
        </div>
        <div class="controls" style="justify-content: center;">
            <button class="btn-next" onclick="loadNewQuiz()">Next Question &rarr;</button>
        </div>
        <div id="quiz-feedback"></div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
