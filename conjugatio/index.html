<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjugatio - Latin Verb Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>

    <!-- Effects Layer -->
    <div id="feedback-overlay" class="hidden"></div>
    <div id="confetti-container"></div>

    <!-- Header -->
    <header class="main-header">
        <div class="container header-content">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10v6M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                </div>
                <div class="logo-text">
                    <h1>Conjugatio</h1>
                    <p>Master Latin Verbs</p>
                </div>
            </div>

            <div class="controls-area">
                <button id="btn-macrons" class="control-btn" title="Toggle vowel length marks">
                    Macrons: <span id="macron-status" class="status-on">ON</span>
                </button>

                <div class="streak-display">
                    <span class="streak-label">Streak</span>
                    <span id="streak-count" class="streak-value">0</span>
                </div>

                <button id="btn-help" class="control-btn icon-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    <span class="btn-text">How to Identify</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="app-container" class="container main-content">
        <!-- Views will be injected here by JavaScript -->
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <p>Verbs sourced from Dickinson College Commentaries Core Vocabulary.</p>
        <div class="footer-link">
            <span>Built for Latin students everywhere.</span>
        </div>
    </footer>

    <!-- Templates -->
    
    <!-- Drill View Template -->
    <template id="template-drill">
        <div class="drill-card fade-in">
            <div class="card-header">
                <span>Principal Parts</span>
            </div>
            <div class="card-body">
                <h2 id="verb-parts" class="latin-text"></h2>
                <p id="verb-definition" class="definition-text"></p>
                
                <div id="etymology-container" class="etymology-section hidden">
                    <button id="btn-toggle-etymology" class="text-link">
                        Show Etymology
                    </button>
                    <div id="etymology-content" class="etymology-box hidden"></div>
                </div>
            </div>
            <div id="feedback-message" class="feedback-box hidden"></div>
        </div>

        <div id="options-grid" class="options-grid">
            <!-- Buttons generated by JS -->
        </div>

        <div id="action-area" class="action-area hidden slide-up">
            <button id="btn-next" class="primary-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                Next Verb <span class="shortcut-hint-lg">N</span>
            </button>

            <div id="ai-section">
                <button id="btn-ai-insight" class="text-link ai-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5c0-5.523 4.477-10 10-10z"/></svg>
                    Ask AI for a mnemonic
                </button>
                <div id="ai-result" class="ai-box hidden"></div>
            </div>
        </div>
    </template>

    <!-- Help View Template -->
    <template id="template-help">
        <div class="help-container fade-in">
            <button id="btn-back" class="ghost-btn">
                ← Back to Practice
            </button>

            <div class="help-card">
                <div class="help-header">
                    <h2>Identifying Conjugations</h2>
                </div>
                <div class="help-content">
                    <p class="intro">To determine the conjugation of a Latin verb, you must look primarily at the <strong>Second Principal Part (Infinitive)</strong> and the <strong>First Principal Part (Present Indicative)</strong>.</p>
                    
                    <div class="help-grid">
                        <div class="help-item border-red">
                            <h3>1st Conjugation</h3>
                            <p><strong>Stem vowel:</strong> Ā</p>
                            <ul>
                                <li>1st P.P. ends in <strong>-ō</strong></li>
                                <li>2nd P.P. ends in <strong>-āre</strong></li>
                            </ul>
                            <div class="example">Ex: amō, amāre</div>
                        </div>

                        <div class="help-item border-gold">
                            <h3>2nd Conjugation</h3>
                            <p><strong>Stem vowel:</strong> Ē (Long)</p>
                            <ul>
                                <li>1st P.P. ends in <strong>-eō</strong></li>
                                <li>2nd P.P. ends in <strong>-ēre</strong> (long 'e')</li>
                            </ul>
                            <div class="example">Ex: moneō, monēre</div>
                        </div>

                        <div class="help-item border-stone">
                            <h3>3rd Conjugation</h3>
                            <p><strong>Stem vowel:</strong> E (Short)</p>
                            <ul>
                                <li>1st P.P. ends in <strong>-ō</strong></li>
                                <li>2nd P.P. ends in <strong>-ere</strong> (short 'e')</li>
                            </ul>
                            <div class="example">Ex: regō, regere</div>
                        </div>

                        <div class="help-item border-dark">
                            <h3>3rd Conjugation (-io)</h3>
                            <p><strong>Hybrid of 3rd & 4th</strong></p>
                            <ul>
                                <li>1st P.P. ends in <strong>-iō</strong></li>
                                <li>2nd P.P. ends in <strong>-ere</strong> (short 'e')</li>
                            </ul>
                            <div class="example">Ex: capiō, capere</div>
                        </div>

                        <div class="help-item border-black">
                            <h3>4th Conjugation</h3>
                            <p><strong>Stem vowel:</strong> Ī</p>
                            <ul>
                                <li>1st P.P. ends in <strong>-iō</strong></li>
                                <li>2nd P.P. ends in <strong>-īre</strong></li>
                            </ul>
                            <div class="example">Ex: audiō, audīre</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Scripts -->
    <script src="verbs.js"></script>
    <script src="script.js"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
